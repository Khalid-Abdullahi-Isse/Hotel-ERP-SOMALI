name: Hotel-ERP
on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:18
      steps:
        - uses: actions/checkout@v2
        - name: Install dependencies
          run: npm install
        - name: Run tests
          run: npm test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Run a one-line script
        run: echo "Hello from Hotel-ERP workflow"