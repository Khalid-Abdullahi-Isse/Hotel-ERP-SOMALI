name: Hotel ERP CI

on:
  push:
    branches:
      - main
      - Khalid-dev

  pull_request:
    branches:
      - main

concurrency:
  group: hotel-erp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: NestJS Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hotel_erp_test
          POSTGRES_USER: hotel_erp
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hotel_erp -d hotel_erp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test

      DATABASE_URL: postgresql://hotel_erp:ci_password@localhost:5432/hotel_erp_test?schema=public
      TEST_DATABASE_URL: postgresql://hotel_erp:ci_password@localhost:5432/hotel_erp_test?schema=public

      REDIS_URL: redis://localhost:6379

      JWT_ACCESS_SECRET: github_actions_ci_secret_12345678901234567890
      JWT_ISSUER: somali-hotel-erp
      JWT_AUDIENCE: somali-hotel-erp-web

      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 7

      CORS_ORIGINS: http://localhost:3000

      RATE_LIMIT_PER_MINUTE: 5000
      CACHE_TTL_MS: 60000

      AUTH_COOKIE_SECURE: false
      AUTH_MAX_FAILED_ATTEMPTS: 5
      AUTH_LOCK_MINUTES: 15

      BODY_LIMIT_BYTES: 1048576
      REQUEST_TIMEOUT_MS: 30000
      TRUST_PROXY_HOPS: 0

      LOG_LEVEL: warn
      SWAGGER_ENABLED: false

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Run backend unit tests
        run: npm test

      - name: Build NestJS backend
        run: npm run build


  frontend:
    name: Next.js Frontend
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: http://localhost:3001/api

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run

      - name: Build Next.js frontend
        run: npm run build


  ci-success:
    name: Hotel ERP CI Passed
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: CI completed
        run: echo "Hotel ERP backend and frontend passed CI."